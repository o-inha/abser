name: Windows x64

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64 -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Upload UI test capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Abser-UI-test
          path: build/ui-smoke*.bmp
          if-no-files-found: ignore
          retention-days: 7
      - name: Package portable app
        shell: pwsh
        run: |
          cmake --install build --config Release --prefix dist/Abser
          Compress-Archive -Path dist/Abser -DestinationPath dist/Abser-Windows-x64.zip
          Get-FileHash dist/Abser-Windows-x64.zip -Algorithm SHA256 | Format-List
      - uses: actions/upload-artifact@v4
        with:
          name: Abser-Windows-x64
          path: dist/Abser-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
